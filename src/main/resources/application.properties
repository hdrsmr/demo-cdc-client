# application.properties
spring.application.name=customer-service


# ==============================================
# Server Configuration
# ==============================================
server.port=8888

# ==============================================
# SQL Server Database Configuration
# ==============================================
spring.datasource.url=jdbc:sqlserver://192.168.181.207:1433;databaseName=tigaraksa;encrypt=false;trustServerCertificate=true
spring.datasource.username=dev_tigaraksa
spring.datasource.password=@D3vtigaraksa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================
# JPA Configuration
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Di application.properties, tambahkan:
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.show_sql=true

# ==============================================
# Spring Boot Configuration
# ==============================================
spring.main.allow-circular-references=true
# add
spring.main.allow-bean-definition-overriding=true

# ==============================================
# Hazelcast Configuration
# ==============================================
spring.cache.type=hazelcast

# ==============================================
# Debezium Configuration - PASTIKAN INI
# ==============================================
debezium.enabled=true
debezium.connector.class=io.debezium.connector.sqlserver.SqlServerConnector
debezium.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.offset.storage.file.filename=./target/offsets.dat
debezium.offset.flush.interval.ms=10000

# Database connection
debezium.database.hostname=192.168.181.207
debezium.database.port=1433
debezium.database.user=dev_tigaraksa
debezium.database.password=@D3vtigaraksa
debezium.database.dbname=tigaraksa
debezium.database.server.name=customer-server

# \u2705 PASTIKAN INI ADA DAN TIDAK KOSONG
debezium.database.names=tigaraksa
debezium.topic.prefix=customer-server

# Table filtering
debezium.table.include.list=dbo.customer
debezium.schema.include.list=dbo

# Snapshot mode
debezium.snapshot.mode=schema_only

#hazelcast
hazelcast.sql.enabled=true
hazelcast.jet.enabled=true

# ==============================================
# Logging loop
# ==============================================
#logging.level.com.abc.hazelcast.cdc=DEBUG
#logging.level.io.debezium=DEBUG
#logging.level.org.hibernate.SQL=DEBUG


# ==============================================
# Logging Configuration - Hanya tampilkan CRUD
# ==============================================
# Nonaktifkan debug logging Debezium
logging.level.io.debezium=WARN
logging.level.io.debezium.embedded=WARN
logging.level.io.debezium.connector.sqlserver=WARN
logging.level.org.apache.kafka=WARN

# Tampilkan log aplikasi saja
logging.level.com.abc.hazelcast.cdc=INFO
logging.level.com.abc.hazelcast.cdc.config=INFO
logging.level.com.abc.hazelcast.cdc.listener=INFO

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ============================================
# HIKARI CONNECTION POOL SETTINGS
# ============================================

# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=20

# Minimum number of idle connections maintained
spring.datasource.hikari.minimum-idle=5

# Maximum time (in ms) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=30000

# Maximum time (in ms) that a connection is allowed to sit idle in the pool
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime (in ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

# Connection test query (for SQL Server)
spring.datasource.hikari.connection-test-query=SELECT 1

# Auto-commit behavior
spring.datasource.hikari.auto-commit=true

# Pool name
spring.datasource.hikari.pool-name=HikariPool-TestDb

# Register JMX MBeans for monitoring
spring.datasource.hikari.register-mbeans=true

# Allow pool suspension
spring.datasource.hikari.allow-pool-suspension=false

# Whether to isolate internal queries
spring.datasource.hikari.isolate-internal-queries=false

# Validation timeout
spring.datasource.hikari.validation-timeout=5000

# Leak detection threshold (in ms)
spring.datasource.hikari.leak-detection-threshold=60000